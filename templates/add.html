{% extends "base.html" %}
{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<div class="page-header animate-in">
  <h1>Add Expense</h1>
  <p>Record a new transaction.</p>
</div>

<div class="form-card animate-in" style="animation-delay:0.05s">
  <form method="post" action="/add">

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required
             value="{{ today }}" />
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" name="category" class="form-control" required>
        <option value="" disabled selected>Choose a category…</option>
        <option>Grocery</option>
        <option>Food & Dining</option>
        <option>Transport</option>
        <option>Utilities</option>
        <option>Entertainment</option>
        <option>Health</option>
        <option>Shopping</option>
        <option>Rent</option>
        <option>Education</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" name="amount" step="0.01" min="0"
             placeholder="0.00" required />
    </div>

    <div class="form-group">
      <label for="note">Note <span style="color:var(--muted);text-transform:none;font-size:0.75rem">(optional)</span></label>
      <textarea id="note" name="note" placeholder="e.g. Weekly groceries from D-Mart…"></textarea>
    </div>

    <div style="display:flex; gap:0.75rem; margin-top:2rem">
      <button type="submit" class="btn btn-primary">Save Expense</button>
      <a href="/" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
